<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gymship</title>
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');
  </style>

</head>
<body>

  <nav>
    <h1>Gym<span>ship</span></h1>
    <div class="link container">
      <a class="link create">Create.</a>
      <a class="link read">Read.</a>
      <a class="link update">Update.</a>
      <a class="link delete">Delete.</a>
    </div>
  </nav>

  <div class="status container">
    <div class="title">Gym Status</div>
    <div class="stat-text container">
      <div class="status total">
        <div id="total-count" class="total number">0</div>
        <div class="total text">Total Members</div>
      </div>
      <div class="status total">
        <div id="active-count" class="active number">0</div>
        <div class="active text">Active Members</div>
      </div>
      <div class="status total">
        <div id="inactive-count" class="inactive number">0</div>
        <div class="inactive text">Inactive Members</div>
      </div>
    </div>
  </div>

  <div class="input container">
    <h1 id="plan-title">Add Membership Plan</h1>
    <div class="input section">
      <label>Name</label>
      <input id="name" type="text" placeholder="Input Name">
    </div>
    <div class="input section">
      <label>Duration (days)</label>
      <input id="duration" type="number" placeholder="0">
    </div>
    <div class="input section">
      <label>Rate</label>
      <input id="rate" type="number" placeholder="0">
    </div>
    <div class="input buttons">
      <button id="saveMembership" class="plan save button">Save</button>
      <button id="cancelMembership" class="plan cancel button">Cancel</button>
    </div>
  </div>

  <div class="input container">
    <h1 id="member-title">Register Member</h1>
    <div class="input section">
      <label>Last Name</label>
      <input id="lastName" type="text" placeholder="Input Last Name">
    </div>
    <div class="input section">
      <label>First Name</label>
      <input id="firstName" type="text" placeholder="Input First Name">
    </div>
    <div class="input section">
      <label>Membership Plan</label>
      <input id="plan" type="text" placeholder="Input plan.">
    </div>
    <div class="input buttons">
      <button id="saveMember" class="member save button">Save</button>
      <button id="cancelMember" class="member cancel button">Cancel</button>
    </div>
  </div>

  <div class="table container">
    <div class="table-head container">
      <h1>Gym Members</h1>
      <div class="search container">
        <input id="search-members" type="text" placeholder="Search">
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Plan</th>
          <th>Attendance</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody class="members table">
      </tbody>
    </table>
  </div>


  <footer>
    <div>© 2026 Gymship</div>
    <div>Built by BSCS - 3A Group</div>
  </footer>
</body>
</html>
